; SHAR Weapon Wheel settings. A line starting with ; is a note.
[WeaponWheel]
; 1 = on, 0 = off
Enabled=1
; game speed while the wheel is open (1 = normal speed)
SlowMotion=0.3
; background blur strength (0 = off, 1 = normal, 2 = strong)
Blur=1
; background brightness while open (1 = unchanged)
Brightness=0.72
; wheel size
Size=1.0
; loudness of the mod's sounds (0 = silent, 1 = full)
Volume=0.6

; ---- controller buttons ----
; Names: A B X Y LB RB LT RT LS RS BACK START DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT
; (LS / RS = clicking the sticks in). Several buttons can share a job: separate them
; with spaces, e.g.  AimButton=DPAD_LEFT LT
; hold to open the weapon wheel
WheelButton=LB
; hold to aim (LT; D-pad left works too)
AimButton=DPAD_LEFT LT
; fire the handgun
FireButton=RT

; ---- aiming with the right stick ----
; speed (1 = normal, 0.5 = half, 2 = double)
AimSensitivity=1.0
; 1 = push the stick up to look down
InvertY=0
; how far the stick must move before the aim does (0.2 = 20 %); raise it if the aim drifts
AimDeadzone=0.20

; ---- keyboard and mouse ----
; 1 = on (play with either, and switch whenever you like)
Keyboard=1
; mouse aiming speed (1 = 0.022 degrees per mouse count, like most PC shooters)
MouseSensitivity=1.0
; 1 = move the mouse up to look down
MouseInvertY=0
; how far to move the mouse to pick a slot in the wheel (raise it if it feels jumpy)
WheelMouseDistance=100
; Keys: A-Z, 0-9, F1-F12, TAB SPACE SHIFT CTRL ALT CAPSLOCK ENTER BACKSPACE GRAVE UP DOWN
; LEFT RIGHT, mouse buttons MOUSE1 (left) MOUSE2 (right) MOUSE3 (middle) MOUSE4 MOUSE5.
; Up to two keys can share a job (KeyAim=MOUSE2 CTRL); NONE turns one off; empty = the default.
; Letters and digits mean the key in that place on a US keyboard, like the game's own keys
; (on a French AZERTY keyboard Q is the key marked A); the hints show your keyboard's letters.
; WeaponWheel.log's "Keys:" lines show what the game is using, and any name it didn't know.
; hold to open the weapon wheel
KeyWheel=TAB
; hold to aim / fire (with a weapon out these mouse buttons are the gun's)
KeyAim=MOUSE2
KeyFire=MOUSE1
; 1 = a quick click of the aim key keeps aiming until you click it again (holding still works);
; made for trackpads, where you can't hold one button and click another. 0 = hold only
AimClick=1
; pick a weapon straight away (the scroll wheel goes through them too)
KeyFists=1
KeyHandgun=2
KeyRPG=3
KeyShotgun=4
; back to the weapon you had before
KeyLastWeapon=Q
; in the wheel: flip between WEAPONS and ITEMS
KeySwitchPage=Q
; get in and out of cars, talk, open doors (the game's left-click) and kick (its right-click):
; for when the mouse buttons are the gun's (in a car the kick key is the handbrake)
KeyAction=E
KeyKick=F

; developer options
Debug=0
